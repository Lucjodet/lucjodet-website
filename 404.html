<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Luc Jodet</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  :root {
    --ink: #1a1a18;
    --ink-soft: #55524c;
    --paper: #faf9f6;
    --line: #e3e0d8;
    --accent: #8c3b23;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--serif); background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 28px; line-height: 1.65;
  }
  .num {
    font-family: var(--sans); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
  }
  h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 500; letter-spacing: -0.015em; margin-bottom: 16px; }
  p { color: var(--ink-soft); max-width: 34em; margin: 0 auto 34px; }
  a.btn {
    font-family: var(--sans); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; padding: 12px 22px; border: 1px solid var(--ink);
    color: var(--ink); transition: all .2s; display: inline-block;
  }
  a.btn:hover { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<main>
  <p class="num">404</p>
  <h1>Page not found</h1>
  <p>This page doesn't exist — everything lives on the homepage.</p>
  <a class="btn" href="/">Back to lucopedia.com</a>
</main>
</body>
</html>
